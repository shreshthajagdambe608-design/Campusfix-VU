ight:1.7;max-width:320px;margin:0 auto}.result-title{font-size:21px;letter-spacing:-.7px;margin:8px 0 14px;line-height:1.2}.result-pills{display:flex;gap:6px;flex-wrap:wrap}.result-block{padding:14px 0;border-top:1px solid #edf0ef;margin-top:14px}.result-block label{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:850;color:#8b999d;display:block;margin-bottom:7px}.result-block p{font-size:11px;color:#52686f;line-height:1.65;margin:0}.result-block ul{padding-left:18px;margin:0;color:#52686f;font-size:11px;line-height:1.7}.scorebar{height:6px;background:#ecf0ee;border-radius:99px;overflow:hidden;margin:9px 0}.scorebar span{display:block;height:100%;border-radius:99px;background:var(--green)}.notice{font-size:10px;color:#8b6725;line-height:1.6;background:#fff8e7;border:1px solid #f4e6bc;border-radius:11px;padding:11px;margin-top:13px}.spinner{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #f5cbbb;border-top-color:var(--orange);animation:spin .7s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{transform:scale(.6);opacity:.65}100%{transform:scale(2.2);opacity:0}}.analysis-progress{display:grid;gap:10px;margin:20px auto 0;max-width:280px;text-align:left}.analysis-step{font-size:10px;color:#89969a;display:flex;align-items:center;gap:8px}.stepdot{width:19px;height:19px;border:1px solid #d8e2df;border-radius:50%;display:grid;place-items:center;font-size:9px}.analysis-step.active{color:#c6542e;font-weight:800}.analysis-step.active .stepdot{background:#fff0e8;border-color:#f4c8b5}

<div id="app" class="hidden"></div><div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toasts" id="toasts"></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATEGORIES=__CATEGORIES__, PRIORITIES=__PRIORITIES__, STATUSES=__STATUSES__, VERIFY_STATES=__VERIFY_STATES__;
let currentUser=null,isAdmin=false,unrestricted=false,reports=[],places=[],mapData=null,health=null,currentView='dashboard',analysis=null,duplicates=[],imageData=null,imageName='',analysing=false,selectedPlace=null,reportQuery='',filters={category:'All',priority:'All',status:'All',verification:'All'};
const api=async(path,opts={})=>{const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch(e){}if(r.status===401&&isAdmin&&path!=='/api/auth/admin'){isAdmin=false;setTimeout(()=>{if($('app'))bootApp()},0);throw new Error('Moderator session ended. Sign in again.')}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d};
function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('toasts').appendChild(el);setTimeout(()=>el.remove(),4800)}
function dateFmt(s){if(!s)return'—';const d=new Date(String(s).replace(' ','T'));return isNaN(d)?s:d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function timeAgo(s){if(!s)return'';const d=new Date(String(s).replace(' ','T'));if(isNaN(d))return s;const mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(mins<1)return'Just now';if(mins<60)return`${mins}m ago`;if(mins<1440)return`${Math.floor(mins/60)}h ago`;return`${Math.floor(mins/1440)}d ago`}
function priorityClass(p){return p==='Urgent'?'red':p==='High'?'amber':p==='Low'?'green':'blue'}function statusClass(s){return s==='Resolved'?'green':s==='In Progress'?'blue':s==='Dismissed'?'':'amber'}function verificationClass(s){return s==='Confirmed genuine'?'green':s==='Possible prank'||s==='Not an issue'?'red':s==='Duplicate report'?'purple':'amber'}
function iconCategory(c){return ({Electrical:'ϟ',Plumbing:'⌁','HVAC & Ventilation':'≈','Cleaning & Waste':'✳','Building & Infrastructure':'▤','Furniture & Equipment':'▱','IT & Connectivity':'⌘','Fire & Life Safety':'△',Security:'◈',Accessibility:'↗','Pest Control':'⌁','Grounds & Landscaping':'♧',Lighting:'☼','Transport & Parking':'↗',Other:'◇'})[c]||'◇'}
function pill(text,cls=''){return `<span class="pill ${cls}">${esc(text)}</span>`}
function avatarHTML(){return `<span class="avatar">${isAdmin?'M':'V'}</span>`}
async function loadSession(){try{const st=await api('/api/auth/status');isAdmin=!!st.is_admin;unrestricted=!!st.unrestricted}catch(e){isAdmin=false;unrestricted=false}currentUser={name:isAdmin?'Moderator':'Public visitor',is_admin:isAdmin}}
function showAdminLogin(){$('modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">MODERATOR ACCESS</div><h2>Moderator sign-in</h2><p>Reporting and viewing are open to everyone. Editing, verifying and deleting need the moderator token.</p></div><button class="icon-btn" onclick="closeModal()" aria-label="Close">×</button></div><div class="modal-body"><div class="field"><label for="admin-token">Moderator token</label><input class="input" id="admin-token" type="password" autocomplete="current-password" placeholder="Paste the token shown in the CampusFix terminal" onkeydown="if(event.key==='Enter')adminLogin()"></div><div class="hint">The token is printed in the terminal window that runs CampusFix, or set as ADMIN_TOKEN in .env.</div><div class="form-actions" style="margin-top:16px"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="admin-login-btn" onclick="adminLogin()">Sign in</button></div></div>`;$('scrim').classList.add('open');setTimeout(()=>$('admin-token')?.focus(),50)}
async function adminLogin(){const token=$('admin-token')?.value||'';if(!token.trim()){toast('Enter the moderator token.','error');return}const btn=$('admin-login-btn');btn.disabled=true;try{await api('/api/auth/admin',{method:'POST',body:JSON.stringify({token})});closeModal();await boot();toast('Moderator tools enabled.','success')}catch(e){btn.disabled=false;toast(e.message,'error')}}
async function boot(){await loadSession();await bootApp()}
async function bootApp(){ $('app').classList.remove('hidden');$('app').innerHTML=appShell();try{const [r,p,h]=await Promise.all([api('/api/reports'),api('/api/places'),api('/api/health')]);reports=r;places=p;health=h;renderView(currentView)}catch(e){$('main-content').innerHTML=`<div class="empty-state"><strong>Could not load the campus desk</strong><p>${esc(e.message)}</p><button class="btn btn-primary" onclick="bootApp()">Retry</button></div>`}}
function appShell(){return `<div class="shell"><aside class="sidebar"><div class="side-logo"><div class="mini-vu">VU</div><div><strong>CampusFix <span style="color:#ff8c64">/</span></strong><small>Campus care desk</small></div></div><div class="side-section">Workspace</div>${navButton('dashboard','◫','Overview')}${navButton('map','⌖','Live campus map')}${navButton('new','＋','Report a problem')}${navButton('reports','▤','Issue register')}${isAdmin?navButton('verification','◉','Verification desk'):''}<div class="side-section">Connection</div><div class="side-status"><div><span class="dot-live"></span><strong id="model-status">Checking local AI</strong></div><p id="model-desc">Private first · Gemma local inference</p></div><div class="side-bottom"><div class="profile">${avatarHTML()}<div style="min-width:0"><strong>${isAdmin?'Moderator':'Visitor'}</strong><small>${isAdmin?(unrestricted?'UNRESTRICTED DEMO MODE':'ADMIN TOOLS ENABLED'):'VIEW + REPORT'}</small></div>${isAdmin?(unrestricted?'<span class="pill orange">OPEN</span>':'<button class="btn btn-light" style="padding:6px 10px;font-size:10px" onclick="logout()">Sign out</button>'):'<button class="btn btn-primary" style="padding:6px 10px;font-size:10px" onclick="showAdminLogin()">Moderator</button>'}</div></div></aside><section class="main-panel"><header class="topbar"><div class="crumb">VISHWAKARMA UNIVERSITY <span style="color:#c2ccca;margin:0 7px">/</span> <strong id="crumb-name">Overview</strong></div><div class="top-actions"><div class="model-pill"><span class="model-dot" id="model-dot"></span><span id="top-model">Gemma local · checking</span></div><button class="btn btn-primary" onclick="showView('new')">＋ Report issue</button></div></header><main class="page-content" id="main-content"></main></section></div><nav class="mobile-nav">${mobileNav('dashboard','⌂','Home')}${mobileNav('map','⌖','Map')}${mobileNav('new','＋','Report')}${mobileNav('reports','▤','Issues')}${isAdmin?mobileNav('verification','◉','Verify'):''}</nav>`}
function navButton(id,ico,label){return `<button class="nav-btn ${currentView===id?'active':''}" data-view="${id}" onclick="showView('${id}')"><span class="nav-ico">${ico}</span>${label}</button>`}function mobileNav(id,ico,label){return `<button class="${currentView===id?'active':''}" data-view="${id}" onclick="showView('${id}')"><span>${ico}</span>${label}</button>`}
function applyHealth(){if(!health)return;const text=health.model_available?'Gemma ready':health.ollama_connected?'Model not found':'AI rules fallback';if($('model-status'))$('model-status').textContent=text;if($('model-desc'))$('model-desc').textContent=health.model_available?'Local image + text analysis enabled':'Text triage only until Ollama + model are ready';if($('top-model'))$('top-model').textContent=health.model_available?'Gemma 4 E4B · ready':'AI setup needed';if($('model-dot'))$('model-dot').style.background=health.model_available?'#29a579':'#e8a144'}
function showView(v){if(v==='verification'&&!isAdmin){toast('Moderator sign-in is required for the verification desk.','error');return}currentView=v;document.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===v));renderView(v);}
function renderView(v){if(!$('main-content'))return;const names={dashboard:'Overview',map:'Live campus map',new:'Report a problem',reports:'Issue register',verification:'Verification desk'};$('crumb-name').textContent=names[v]||'Overview';document.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===v));applyHealth();if(v==='dashboard')renderDashboard();if(v==='map')renderMap();if(v==='new')renderNew();if(v==='reports')renderReports();if(v==='verification')renderVerification()}
function openCount(){return reports.filter(r=>!['Resolved','Dismissed'].includes(r.status)).length}function urgentCount(){return reports.filter(r=>['High','Urgent'].includes(r.ai_analysis?.priority)&&!['Resolved','Dismissed'].includes(r.status)).length}function unverifiedCount(){return reports.filter(r=>(r.verification_state||'Pending verification')==='Pending verification').length}
function latestRows(arr,limit=5){return arr.slice(0,limit).map(r=>{const a=r.ai_analysis||{};const urgent=a.priority==='Urgent';return `<button class="report-row" onclick="openReport('${esc(r.id)}')"><span class="report-symbol ${urgent?'urgent':r.status==='Resolved'?'calm':''}">${iconCategory(a.category)}</span><span class="report-meta"><span class="report-title">${esc(a.title||r.user_description||'Campus issue')}</span><span class="report-sub">${esc(r.user_location)} · ${esc(r.id)}</span></span><span class="report-end">${pill(a.priority||'Medium',priorityClass(a.priority))}<small>${esc(timeAgo(r.created_at))}</small></span></button>`}).join('')}
function renderDashboard(){const total=reports.length,open=openCount(),high=urgentCount(),done=reports.filter(r=>r.status==='Resolved').length;const cats={};for(const r of reports.filter(r=>!['Resolved','Dismissed'].includes(r.status))){const c=r.ai_analysis?.category||'Other';cats[c]=(cats[c]||0)+1}const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);$('main-content').innerHTML=`<section class="hero"><div class="hero-content"><div class="eyebrow">VU · CAMPUS CARE CONTROL ROOM</div><h1>A better campus starts with <em>noticing.</em></h1><p>One clear report can turn a small problem into a resolved one. Share real observations, help the right team find the issue, and keep the follow-through visible.</p><div class="hero-cta"><button class="btn btn-primary" onclick="showView('new')">＋ Report an issue</button><button class="btn btn-light" onclick="showView('map')">Explore live map ↗</button></div></div><aside class="hero-side"><div><div class="eyebrow">CAMPUS SIGNAL</div><h3>${open?open+' open signals to review':'Your campus desk is clear'}</h3><p>${unverifiedCount()} report${unverifiedCount()===1?'':'s'} awaiting a human verification decision. AI never auto-rejects a report.</p></div><button class="hero-link" onclick="showView('${isAdmin?'verification':'reports'}')">${isAdmin?'Open verification desk':'Review issue register'} →</button></aside></section><div class="stats"><div class="card stat"><div class="stat-top">TOTAL SIGNALS<span class="stat-icon si-orange">▤</span></div><div class="stat-num">${total}</div><div class="stat-foot">All submitted reports</div></div><div class="card stat"><div class="stat-top">OPEN ISSUES<span class="stat-icon si-red">◉</span></div><div class="stat-num">${open}</div><div class="stat-foot">Awaiting resolution</div></div><div class="card stat"><div class="stat-top">HIGH / URGENT<span class="stat-icon si-blue">ϟ</span></div><div class="stat-num">${high}</div><div class="stat-foot">Prioritise safety checks</div></div><div class="card stat"><div class="stat-top">RESOLVED<span class="stat-icon si-green">✓</span></div><div class="stat-num">${done}</div><div class="stat-foot">Closed by campus team</div></div></div><div class="dashboard-grid"><section class="card section-card"><div class="section-head"><div><h3>Latest campus signals</h3><p>New reports and work in progress</p></div><button class="text-action" onclick="showView('reports')">View issue register →</button></div>${reports.length?latestRows(reports,5):emptyInline('No reports yet','You can create the first campus issue report.','Report an issue','new')}</section><section class="card section-card"><div class="section-head"><div><h3>What needs attention?</h3><p>Open issues by category · preliminary AI triage</p></div><span class="pill orange">LIVE</span></div><div class="integrity-card"><div class="integrity-top"><div><h4>Verification queue</h4><p>Human confirmation remains the source of truth</p></div><div class="integrity-score">${unverifiedCount()}</div></div><p>${isAdmin?'Review evidence, check the reported location, and record a moderation decision.':'Reports should be verified against on-site facts before anyone treats them as confirmed.'}</p><button class="btn btn-light" style="width:100%" onclick="showView('${isAdmin?'verification':'reports'}')">${isAdmin?'Review pending reports':'Open issue register'} →</button></div><div class="mini-list">${topCats.length?topCats.map(([c,n])=>`<div><div class="mini-list-row"><span>${esc(c)}</span><strong>${n}</strong></div><div class="bar"><span style="width:${Math.max(5,100*n/Math.max(...topCats.map(x=>x[1])))}%"></span></div></div>`).join(''):'<div class="empty-state"><strong>No open category signals</strong><p>New reports will appear here.</p></div>'}</div></section></div><div class="footer"><span>VU CampusFix · Evidence first, human review always.</span><span>${isAdmin?'Moderator view':'Public view'}</span></div>`}
function emptyInline(title,body,button='Report issue',view='new'){return `<div class="empty-state"><strong>${esc(title)}</strong><p>${esc(body)}</p><button class="btn btn-primary" onclick="showView('${view}')">${esc(button)}</button></div>`}
function reportMatches(r){const a=r.ai_analysis||{},q=reportQuery.toLowerCase();const text=[r.id,r.user_description,r.user_location,a.title,a.category,a.priority,r.status,r.verification_state].join(' ').toLowerCase();return(!q||text.includes(q))&&(filters.category==='All'||a.category===filters.category)&&(filters.priority==='All'||a.priority===filters.priority)&&(filters.status==='All'||r.status===filters.status)&&(filters.verification==='All'||(r.verification_state||'Pending verification')===filters.verification)}
function filteredReports(){return reports.filter(reportMatches)}
function reportLine(r){const a=r.ai_analysis||{};return `<div class="full-report" role="button" tabindex="0" onclick="openReport('${esc(r.id)}')" onkeydown="if(event.key==='Enter')openReport('${esc(r.id)}')"><div><span class="fr-label">Issue</span><span class="fr-title">${esc(a.title||r.user_description||'Campus issue')}</span><span class="fr-sub">${esc(r.id)} · ${esc(r.user_location)}</span></div><div class="fr-col"><span class="fr-label">Category</span>${pill(a.category||'Other','purple')}</div><div class="fr-col"><span class="fr-label">Priority</span>${pill(a.priority||'Medium',priorityClass(a.priority))}</div><div class="fr-col"><span class="fr-label">Verification</span>${pill(r.verification_state||'Pending verification',verificationClass(r.verification_state||'Pending verification'))}</div><div class="row-arrow">›</div></div>`}
function renderReports(){const arr=filteredReports();$('main-content').innerHTML=`<div class="page-head"><div><div class="eyebrow">REPORTS · FOLLOW THE SIGNAL</div><h1>Issue register</h1><p>Search reports, see their location and priority, and open a ticket for its evidence and current status.</p></div><button class="btn btn-primary" onclick="showView('new')">＋ New report</button></div><div class="card toolbar"><div class="searchbox"><span>⌕</span><input class="input" value="${esc(reportQuery)}" placeholder="Search issue, ticket, location…" oninput="reportQuery=this.value;updateList()" aria-label="Search reports"></div><select onchange="filters.category=this.value;updateList()"><option>All</option>${CATEGORIES.map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="filters.priority=this.value;updateList()"><option>All</option>${PRIORITIES.map(c=>`<option ${filters.priority===c?'selected':''}>${c}</option>`).join('')}</select><select onchange="filters.status=this.value;updateList()"><option>All</option>${STATUSES.map(c=>`<option ${filters.status===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn btn-light" onclick="reportQuery='';filters={category:'All',priority:'All',status:'All',verification:'All'};renderReports()">Reset</button></div><div class="card report-list-card"><div class="table-head"><span>REPORTS · ${arr.length} matching</span><span>Click a row to open details</span></div><div id="report-rows">${arr.length?arr.map(reportLine).join(''):emptyInline('No matching reports','Try another search or clear filters.','Clear filters','reports')}</div></div><div class="footer"><span>Report state and verification state are separate. A suspicious signal is never auto-dismissed.</span><span>Stored locally in SQLite</span></div>`}

function renderVerification(){if(!isAdmin){showView('dashboard');return}const queue=reports.filter(r=>(r.verification_state||'Pending verification')==='Pending verification').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('main-content').innerHTML=`<div class="page-head"><div><div class="eyebrow">MODERATOR TOOLS · HUMAN REVIEW</div><h1>Verification desk</h1><p>AI can highlight suspicious signals; moderators record the review here, but real-world facts still need checking.</p></div><span class="pill amber">${queue.length} pending</span></div><div class="card section-card" style="margin-bottom:18px"><div class="section-head"><div><h3>How to review fairly</h3><p>Use location, photo, reporter context, and an on-site check where practical.</p></div></div><div class="mini-list"><div class="mini-list-row"><span>Evidence completeness score</span><strong>Not a probability of truth</strong></div><div class="mini-list-row"><span>Possible prank decision</span><strong>Staff note required</strong></div><div class="mini-list-row"><span>Duplicate reports</span><strong>May indicate a real recurring issue</strong></div></div></div><div class="card report-list-card"><div class="table-head"><span>AWAITING VERIFICATION · ${queue.length}</span><span>Open report to record decision</span></div>${queue.length?queue.map(reportLine).join(''):emptyInline('Verification queue is clear','New reports will arrive here once students submit them.','View all reports','reports')}</div><div class="footer"><span>Moderator actions are recorded in the local audit log.</span><span>Moderators only</span></div>`}
function renderMap(){mapData={places,markers:[]};let openMarkers=[];for(const r of reports){const p=places.find(p=>p.id===r.building_id)||places.find(p=>r.user_location?.toLowerCase().includes(p.name.toLowerCase()))||places.find(p=>p.id==='other-area')||places[0];if(!p)continue;let h=parseInt([...r.id].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7).toString());let angle=(h%360)*Math.PI/180,rad=92+(h%3)*13;openMarkers.push({...r,px:Math.max(18,Math.min(982,p.x+Math.cos(angle)*rad)),py:Math.max(18,Math.min(602,p.y+Math.sin(angle)*rad)),placeName:p.name})}mapData.markers=openMarkers;const mapSvg=`<svg id="campus-svg" viewBox="0 0 1000 620" preserveAspectRatio="none" role="img" aria-label="Editable schematic campus layout with issue markers"><defs><pattern id="mapgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8ca99b" stroke-width=".6"/></pattern><linearGradient id="grass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8f0e7"/><stop offset="1" stop-color="#dce9df"/></linearGradient></defs><rect width="1000" height="620" fill="url(#grass)"/><rect width="1000" height="620" fill="url(#mapgrid)" class="map-grid"/><path d="M0 300 C180 260 260 330 440 300 S760 265 1000 315" stroke="#c4d8ce" stroke-width="48" fill="none" stroke-linecap="round"/><path d="M0 300 C180 260 260 330 440 300 S760 265 1000 315" stroke="#fffdf6" stroke-width="34" fill="none" stroke-linecap="round"/><path d="M170 0 Q205 120 265 190 T270 355 T135 545 M470 175 L480 375 L475 540 M700 195 L700 380 L850 420" stroke="#fffdf6" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 80 C180 40 210 80 190 110 S125 128 130 80 M530 490 C580 450 625 500 590 530 S520 535 530 490 M820 80 C860 40 905 75 885 110 S820 115 820 80" fill="#c4dfcc" stroke="#a9cbb7" stroke-width="1.3"/><text x="26" y="32" font-size="12" fill="#6c8980" font-weight="900" letter-spacing="2">VU CAMPUS · SIGNAL MAP</text><text x="974" y="32" text-anchor="end" font-size="11" fill="#718d84">N ↑</text>${places.map(p=>`<g class="building ${selectedPlace===p.id?'selected':''} ${isAdmin?'admin-drag':''}" data-building-id="${esc(p.id)}" transform="translate(${p.x} ${p.y})"><rect x="-79" y="-29" width="158" height="58"/><text y="-2">${esc(p.name.length>19?p.name.slice(0,18)+'…':p.name)}</text><text class="sub" y="14">${esc(p.kind)}</text></g>`).join('')}${openMarkers.map(m=>{const st=m.status==='Resolved'?'resolved':m.status==='Dismissed'?'dismissed':'';const color=st==='resolved'?'#20a37a':st==='dismissed'?'#89989b':'#df3d49';return `<g class="map-pin ${st}" data-report-id="${esc(m.id)}" onclick="openReport('${esc(m.id)}')" role="button" tabindex="0"><circle class="pin-wave" cx="${m.px}" cy="${m.py}" r="8"/><circle class="pin-core" cx="${m.px}" cy="${m.py}" r="10" fill="${color}"/><text x="${m.px}" y="${m.py+.4}">!</text><title>${esc(m.id)} · ${esc(m.ai_analysis?.title||m.user_description)}</title></g>`}).join('')}</svg>`;$('main-content').innerHTML=`<div class="page-head"><div><div class="eyebrow">VU · BUILDING SIGNALS</div><h1>Live campus map</h1><p>See where issues cluster. Red markers represent unresolved reports; open any marker to inspect its ticket.</p></div><button class="btn btn-primary" onclick="showView('new')">＋ Report from campus</button></div><div class="map-layout"><section class="card map-card"><div class="map-title-row"><div><h3>Campus signal field</h3><p>${openCount()} open reports across ${places.length} editable campus zones</p></div><span class="pill orange">LIVE DATA</span></div><div class="map-wrap">${mapSvg}</div><div class="map-legend"><span><i class="legend-dot" style="background:#df3d49"></i>Open issue</span><span><i class="legend-dot" style="background:#20a37a"></i>Resolved</span><span><i class="legend-dot" style="background:#89989b"></i>Dismissed</span><span>${isAdmin?'Drag a building to reposition it':'Select any marker to open the report'}</span></div><div class="map-notice">Editable schematic — these building positions are placeholders, not an official VU architectural map. Calibrate positions against an authorised campus plan before using this for navigation.</div></section><aside class="map-side"><section class="card section-card"><div class="section-head"><div><h3>Open signal queue</h3><p>Latest unresolved reports</p></div><span class="pill red">${openCount()} OPEN</span></div><div class="issue-queue">${reports.filter(r=>!['Resolved','Dismissed'].includes(r.status)).slice(0,7).map(r=>`<button class="queue-item" onclick="openReport('${esc(r.id)}')"><span class="queue-dot"></span><span><strong>${esc(r.ai_analysis?.title||r.user_description)}</strong><small>${esc(r.user_location)}<br>${esc(r.id)} · ${esc(r.ai_analysis?.priority||'Medium')}</small></span></button>`).join('')||'<div class="empty-state"><strong>No open issues</strong><p>New submissions will appear on the map.</p></div>'}</div></section>${isAdmin?`<section class="card section-card"><div class="section-head"><div><h3>Map editor</h3><p>Drag a block or rename the selected zone</p></div><span class="pill purple">MODERATOR</span></div><p class="admin-map-tip">Move any building block directly on the map. Coordinates are saved locally for all users of this app instance.</p><div class="field"><label>Selected campus zone</label><select id="place-select" onchange="selectedPlace=this.value;renderMap()">${places.map(p=>`<option value="${esc(p.id)}" ${p.id===selectedPlace?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Display name</label><input class="input" id="place-name" maxlength="80" value="${esc((places.find(p=>p.id===selectedPlace)||places[0]||{}).name||'')}" placeholder="Building / campus zone"></div><div class="field"><label>Zone type</label><input class="input" id="place-kind" maxlength="50" value="${esc((places.find(p=>p.id===selectedPlace)||places[0]||{}).kind||'')}" placeholder="Academic, Services…"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="savePlace()">Save zone</button><button class="btn btn-light" onclick="addPlace()">＋ Add zone</button><button class="btn btn-light" onclick="resetMap()">Reset positions</button></div></section>`:`<section class="card section-card"><div class="section-head"><div><h3>Where should I report?</h3><p>Pick a known zone in the report form. Staff can calibrate the map to the real campus layout.</p></div></div><button class="btn btn-light" style="width:100%" onclick="showView('new')">Create a report →</button></section>`}</aside></div><div class="footer"><span>Map positions are editable and approximate until calibrated.</span><span>Issue facts still require human confirmation.</span></div>`;wireMapDrag()}
function wireMapDrag(){const svg=$('campus-svg');if(!svg)return;let drag=null;const coords=e=>{const rect=svg.getBoundingClientRect();return{x:Math.max(20,Math.min(980,(e.clientX-rect.left)/rect.width*1000)),y:Math.max(20,Math.min(600,(e.clientY-rect.top)/rect.height*620))}};svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.building');if(!g||!isAdmin)return;const id=g.dataset.buildingId;drag={id,g,start:coords(e),orig:places.find(p=>p.id===id),moved:false};g.setPointerCapture?.(e.pointerId);e.preventDefault()});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e);if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>3)drag.moved=true;if(drag.moved)drag.g.setAttribute('transform',`translate(${p.x} ${p.y})`)});svg.addEventListener('pointerup',async e=>{if(!drag)return;const done=drag;drag=null;if(!done.moved){selectedPlace=done.id;renderMap();return}const p=coords(e);try{const upd=await api('/api/places/'+encodeURIComponent(done.id),{method:'PATCH',body:JSON.stringify({x:Math.round(p.x),y:Math.round(p.y)})});places=places.map(x=>x.id===upd.id?upd:x);selectedPlace=upd.id;toast('Campus zone position saved.','success');renderMap()}catch(err){toast(err.message,'error');renderMap()}})}
async function savePlace(){const id=$('place-select')?.value||selectedPlace;if(!id)return;try{const updated=await api('/api/places/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({name:$('place-name').value.trim(),kind:$('place-kind').value.trim()})});places=places.map(p=>p.id===id?updated:p);selectedPlace=id;toast('Campus zone saved.','success');renderMap()}catch(e){toast(e.message,'error')}}
async function addPlace(){const name=prompt('Campus building / zone name?');if(!name||!name.trim())return;try{const p=await api('/api/places',{method:'POST',body:JSON.stringify({name:name.trim(),kind:'Campus zone'})});places.push(p);selectedPlace=p.id;toast('New campus zone added. Drag it into position.','success');renderMap()}catch(e){toast(e.message,'error')}}
async function resetMap(){if(!confirm('Reset all zone positions to the editable example layout? Report data will not be changed.'))return;try{places=await api('/api/places/reset',{method:'POST',body:JSON.stringify({})});selectedPlace=null;toast('Schematic positions reset.','success');renderMap()}catch(e){toast(e.message,'error')}}
function renderNew(){analysis=null;duplicates=[];imageData=null;imageName='';analysing=false;$('main-content').innerHTML=`<div class="page-head"><div><div class="eyebrow">CREATE A CAMPUS SIGNAL</div><h1>What needs attention?</h1><p>Share what you observed, pinpoint the area, and let AI help route it. A photo can help, but do not approach any danger to take one.</p></div><span class="pill green">${health?.model_available?'GEMMA CONNECTED':'PRELIMINARY MODE'}</span></div><div class="form-layout"><section class="card form-card"><h3>Incident details</h3><p class="desc">Clear information leads to faster action. Separate what you observed from what you suspect caused it.</p><form id="issue-form" onsubmit="event.preventDefault();saveIssue()"><div class="field"><label for="issue-desc">What did you notice? <small>Required unless an image is provided</small></label><textarea class="input" id="issue-desc" maxlength="3000" placeholder="Example: Water is spreading from the sink beside Room 204. The floor is slippery and two people have walked around it. I noticed this around 10:20 AM…"></textarea><div class="hint"><span id="desc-count">0</span>/3000 · Describe the visible problem, its impact, and when you noticed it.</div></div><div class="field"><label for="issue-place">Which campus zone?</label><select id="issue-place" required>${places.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><div class="hint">Moderators can calibrate zone positions in the map editor.</div></div><div class="field"><label for="issue-room">Floor, room or nearest landmark <small>Recommended</small></label><input class="input" id="issue-room" maxlength="150" placeholder="e.g. Level 2, outside Room 204 / east stairwell"></div><div class="field"><label>Photo evidence <small>Optional · JPG / PNG / WebP</small></label><label for="issue-image" class="upload" id="upload-zone"><input id="issue-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="handleFile(this.files?.[0])"><div class="upload-icon">↥</div><strong>Drop a photo here or click to browse</strong><p>Up to 8 MB · Image is sent to local Gemma only when connected.</p><div id="image-preview"></div></label></div><div class="notice" style="margin-top:0"><b>Safety first.</b> Never touch an exposed wire, confront a person, enter a hazardous area, or delay contacting campus security to collect evidence.</div><div class="form-actions"><button type="button" class="btn btn-light" onclick="showView('dashboard')">Cancel</button><button type="button" class="btn btn-dark" id="analyze-btn" onclick="analyzeIssue()">✳ Analyse evidence</button></div></form></section><aside class="card analysis-card" id="analysis-card"><div class="analysis-head"><div><h3>AI triage report</h3><p>Category · urgency · evidence quality</p></div><span class="pill purple">REVIEW</span></div><div class="analysis-body"><div class="analysis-empty"><div class="ai-orb">✳</div><h4>Evidence in. Direction out.</h4><p>CampusFix will categorise the issue, suggest a response team, flag safety concerns and check for similar open reports.</p></div></div></aside></div><div class="footer"><span>AI assists triage; staff confirm facts and final decisions.</span><span>Reports are reviewed by campus staff</span></div>`;$('issue-desc').addEventListener('input',e=>$('desc-count').textContent=e.target.value.length);const z=$('upload-zone');z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag')});z.addEventListener('dragleave',()=>z.classList.remove('drag'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag');const f=e.dataTransfer.files?.[0];if(f)handleFile(f)})}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('Choose a photo file.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read image'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Could not open image'));img.onload=()=>{const scale=Math.min(1,1500/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function handleFile(file){if(!file)return;if(file.size>8*1024*1024){toast('Image exceeds 8 MB. Choose a smaller file.','error');return}try{imageData=await compressImage(file);imageName=file.name;$('image-preview').innerHTML=`<div class="upload-preview"><img src="${imageData}" alt="Preview"><div><strong>${esc(file.name)}</strong><br><span class="muted" style="font-size:10px">Compressed and ready</span></div><button type="button" onclick="event.preventDefault();event.stopPropagation();removeImage()">Remove</button></div>`;$('analyze-btn').textContent='✳ Analyse text + photo'}catch(e){toast(e.message,'error')}}function removeImage(){imageData=null;imageName='';if($('issue-image'))$('issue-image').value='';if($('image-preview'))$('image-preview').innerHTML='';if($('analyze-btn'))$('analyze-btn').textContent='✳ Analyse evidence'}
function setAnalysisPanelLoading(){const body=document.querySelector('#analysis-card .analysis-body');if(!body)return;body.innerHTML=`<div class="analysis-empty"><div class="ai-orb"><span class="spinner"></span></div><h4>Reading the signal…</h4><p>Starting with the details you supplied, checking issue patterns and searching for similar open reports.</p><div class="analysis-progress"><div class="analysis-step active"><span class="stepdot">1</span>Understanding the issue</div><div class="analysis-step"><span class="stepdot">2</span>Checking image evidence (when Gemma is ready)</div><div class="analysis-step"><span class="stepdot">3</span>Finding category, urgency and similar reports</div></div></div>`;let i=0;const interval=setInterval(()=>{i++;const steps=document.querySelectorAll('.analysis-step');if(steps.length){steps.forEach((s,j)=>s.classList.toggle('active',j<=Math.min(i,2)))}if(i>=3)clearInterval(interval)},1200);return interval}
function renderAnalysisPanel(){const card=$('analysis-card');if(!card)return;const body=card.querySelector('.analysis-body');if(!body)return;if(!analysis){body.innerHTML='<div class="analysis-empty"><div class="ai-orb">✳</div><h4>Evidence in. Direction out.</h4><p>Run the analysis to receive a category, priority, action plan, integrity signals and duplicate hints.</p></div>';return}const a=analysis,conf=Math.round((a.confidence||0)*100),score=Number(a.integrity_score||0);body.innerHTML=`<div class="eyebrow">${esc(a.analysis_mode||'PRELIMINARY TRIAGE')}</div><h2 class="result-title">${esc(a.title||'Campus issue needs review')}</h2><div class="result-pills">${pill(a.category||'Other','purple')}${pill(a.priority||'Medium',priorityClass(a.priority))}${pill(a.integrity_assessment||'Needs human verification',score>=72?'green':'amber')}</div><div class="result-block"><label>Recommended response</label><p>${esc(a.recommended_action||'Ask campus facilities staff to inspect the issue.')}</p></div><div class="result-block"><label>Evidence quality · ${score}/100</label><div class="scorebar"><span style="width:${score}%;background:${score>=72?'#20a37a':score>=48?'#dda044':'#df3d49'}"></span></div><p>${esc(a.integrity_reason||'Staff must confirm on site.')}<br><b>This is not a probability of truth.</b></p></div><div class="result-block"><label>AI category confidence · ${conf}%</label><div class="scorebar"><span style="width:${conf}%;background:#6552bc"></span></div><p>${conf>=80?'Strong classification signals; confirm before dispatch.':conf>=55?'Moderate confidence; review the category.':'Weak signals; manual triage is recommended.'} The estimate is not calibrated.</p></div><div class="result-block"><label>Evidence & observations</label><ul>${[...(a.observations||[]),...(a.visual_findings||[])].map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No concrete observation extracted.</li>'}</ul></div>${a.suspicious_signals?.length?`<div class="result-block"><label>Signals that need checking</label><ul>${a.suspicious_signals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${duplicates.length?`<div class="result-block"><label>Possible related reports (${duplicates.length})</label><ul>${duplicates.slice(0,4).map(d=>`<li><b>${esc(d.report_id)}</b> · ${esc(d.title)} (${Math.round(d.similarity_score*100)}% text/location match)</li>`).join('')}</ul><p style="margin-top:7px">A duplicate can still reflect a real recurring issue; moderators should check before merging.</p></div>`:''}${a.safety_note&&a.safety_note!=='None'?`<div class="notice"><b>Safety note:</b> ${esc(a.safety_note)}</div>`:''}<div class="notice">${imageData&&!String(a.analysis_mode||'').toLowerCase().includes('gemma')?'Photo attached, but this preliminary rule-based result did not visually interpret it. Connect Gemma for image analysis.':'AI review is advisory. No report is automatically marked true or prank.'}</div><div class="field" style="margin-top:16px"><label>Confirm category before submitting</label><select id="confirm-category">${CATEGORIES.map(c=>`<option ${c===a.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Confirm priority</label><select id="confirm-priority">${PRIORITIES.map(c=>`<option ${c===a.priority?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-actions"><button class="btn btn-light" onclick="analysis=null;duplicates=[];renderAnalysisPanel()">Clear</button><button class="btn btn-primary" ${analysing?'disabled':''} onclick="saveIssue(true)">${analysing?'Gemma refining…':'Submit report ↗'}</button></div>`}
async function analyzeIssue(){const desc=$('issue-desc')?.value.trim()||'';if(!desc&&!imageData){toast('Add a short description or a photo first.','error');return}if(!$('issue-place')?.value){toast('Choose a campus zone.','error');return}analysis=null;duplicates=[];analysing=true;const btn=$('analyze-btn');btn.disabled=true;btn.innerHTML='<span class=\"spinner\"></span> Quick check';const timer=setAnalysisPanelLoading();const pl=places.find(p=>p.id===$('issue-place').value);const room=$('issue-room').value.trim();const loc=(pl?.name||'')+(room?' · '+room:'');const body=JSON.stringify({description:desc,location:loc,building_id:pl?.id,image_base64:imageData});try{const quick=await api('/api/reports/preflight',{method:'POST',body});analysis=quick.ai_analysis;duplicates=quick.potential_duplicates||[];renderAnalysisPanel();if(health?.model_available){btn.innerHTML='<span class=\"spinner\"></span> Gemma refining';toast('Quick triage ready. Gemma is refining the result…','');const result=await api('/api/reports/analyze',{method:'POST',body});analysis=result.ai_analysis;duplicates=result.potential_duplicates||[];renderAnalysisPanel();toast(result.source==='gemma-local'?'Gemma review complete — verify the evidence and priority.':'Fast triage remains available; Gemma refinement did not connect.','success')}else{toast('Fast triage ready. Connect Ollama + Gemma for image-aware analysis.','success')}}catch(e){analysis=null;duplicates=[];renderAnalysisPanel();toast('Could not analyse: '+e.message,'error')}finally{clearInterval(timer);analysing=false;if($('analyze-btn')){btn.disabled=false;btn.textContent=imageData?'✳ Analyse text + photo':'✳ Analyse evidence'}renderAnalysisPanel()}}
async function saveIssue(fromAnalysis=false){const desc=$('issue-desc')?.value.trim()||'';const placeId=$('issue-place')?.value;const place=places.find(p=>p.id===placeId);const room=$('issue-room')?.value.trim()||'';if(!desc&&!imageData){toast('Add a description or a photo before submitting.','error');return}if(!place){toast('Choose a campus zone.', 'error');return}if(!analysis||!fromAnalysis){await analyzeIssue();if(!analysis)return;toast('Review the AI triage, then click Submit report to save.','');return}if($('confirm-category'))analysis.category=$('confirm-category').value;if($('confirm-priority'))analysis.priority=$('confirm-priority').value;const loc=place.name+(room?' · '+room:'');try{const created=await api('/api/reports',{method:'POST',body:JSON.stringify({user_description:desc||'No written description; please review the attached photo.',user_location:loc,image_data:imageData,ai_analysis:analysis,building_id:placeId})});reports.unshift(created);toast('Report submitted. It is awaiting human verification.','success');showView('reports');openReport(created.id)}catch(e){toast('Could not save report: '+e.message,'error')}}
async function openReport(id){try{const r=await api('/api/reports/'+encodeURIComponent(id));renderReportModal(r)}catch(e){toast(e.message,'error')}}
function renderReportModal(r){const a=r.ai_analysis||{},score=Number(a.integrity_score||0);const admin=isAdmin;const notes=esc(r.staff_notes||'');$('modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">VU ISSUE RECORD · ${esc(r.id)}</div><h2>${esc(a.title||r.user_description||'Campus issue')}</h2><p>Submitted ${esc(dateFmt(r.created_at))} · ${esc(r.user_location)}</p></div><button class="icon-btn" onclick="closeModal()" aria-label="Close">×</button></div><div class="modal-body"><div class="detail-grid"><div><div class="detail-tags">${pill(a.category||'Other','purple')}${pill(a.priority||'Medium',priorityClass(a.priority))}${pill(r.status||'Submitted',statusClass(r.status))}${pill(r.verification_state||'Pending verification',verificationClass(r.verification_state||'Pending verification'))}</div><p class="detail-desc">${esc(r.user_description||a.description||'No written description supplied.')}</p>${r.image_data?`<img class="detail-img" src="${r.image_data}" alt="Reporter evidence">`:''}<div class="detail-section"><h4>Recommended action</h4><p>${esc(a.recommended_action||'Ask facilities staff to inspect the issue.')}</p></div>${a.safety_note&&a.safety_note!=='None'?`<div class="detail-section"><h4>Safety note</h4><p style="color:#b73547">${esc(a.safety_note)}</p></div>`:''}<div class="detail-section"><h4>Evidence quality · ${score}/100</h4><p>${esc(a.integrity_assessment||'Needs human verification')} — ${esc(a.integrity_reason||'Staff check required.')}<br><b>Score is evidence completeness, not real/fake probability.</b></p>${a.suspicious_signals?.length?`<ul>${a.suspicious_signals.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div><div class="detail-section"><h4>Observations from AI</h4><ul>${[...(a.observations||[]),...(a.visual_findings||[])].map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No observations extracted.</li>'}</ul></div>${r.potential_duplicates?.length?`<div class="detail-section"><h4>Possible related tickets</h4><ul>${r.potential_duplicates.map(d=>`<li><button class="text-action" onclick="openReport('${esc(d.report_id)}')">${esc(d.report_id)} · ${esc(d.title)}</button> (${Math.round(d.similarity_score*100)}% similar)</li>`).join('')}</ul></div>`:''}<div class="detail-section"><h4>AI method</h4><p>${esc(a.analysis_mode||'Legacy report')}. AI output is advisory and does not confirm the real-world condition.</p></div></div><aside class="detail-side"><h3 style="font-size:13px;margin:0 0 5px">${admin?'Moderator controls':'Ticket status'}</h3><p style="font-size:10px;color:var(--muted);line-height:1.6;margin:0 0 15px">${admin?'Changes are saved to the audit trail.':'Ticket status'}</p>${admin?`<div class="field"><label for="detail-status">Workflow status</label><select id="detail-status">${STATUSES.map(s=>`<option ${s===r.status?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="detail-verify">Human verification decision</label><select id="detail-verify">${VERIFY_STATES.map(s=>`<option ${s===(r.verification_state||'Pending verification')?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="detail-assigned">Assigned team / person</label><input id="detail-assigned" class="input" value="${esc(r.assigned_to||a.suggested_team||'')}" maxlength="160"></div><div class="field"><label for="detail-notes">Moderator notes ${r.verification_state==='Possible prank'?'(required)':''}</label><textarea id="detail-notes" style="min-height:100px" maxlength="3000" placeholder="What was checked on site? Why is a report marked duplicate or suspicious?">${notes}</textarea></div><button class="btn btn-primary" onclick="saveReportDetails('${esc(r.id)}')">Save review decision</button><button class="btn btn-danger" onclick="deleteReport('${esc(r.id)}')">Delete report</button><div class="hint" style="margin-top:12px">Verified by: ${esc(r.verified_by||'Not reviewed')} ${r.verified_at?'· '+esc(r.verified_at):''}</div>`:`<div class="field"><label>Workflow status</label>${pill(r.status||'Submitted',statusClass(r.status))}</div><div class="field"><label>Verification decision</label>${pill(r.verification_state||'Pending verification',verificationClass(r.verification_state||'Pending verification'))}</div><div class="field"><label>Assigned team</label><p style="font-size:11px">${esc(r.assigned_to||a.suggested_team||'Pending assignment')}</p></div><div class="notice">AI is never the final judge. If this report affects safety, alert campus staff directly.</div>`}</aside></div></div>`;$('scrim').classList.add('open')}
async function saveReportDetails(id){const data={status:$('detail-status').value,verification_state:$('detail-verify').value,assigned_to:$('detail-assigned').value.trim(),staff_notes:$('detail-notes').value};try{const updated=await api('/api/reports/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)});reports=reports.map(r=>r.id===id?updated:r);toast('Review decision saved and logged.','success');renderReportModal(await api('/api/reports/'+encodeURIComponent(id)));renderView(currentView)}catch(e){toast(e.message,'error')}}
async function deleteReport(id){if(!confirm('Permanently delete this report? This cannot be undone. The action is recorded in the audit trail.'))return;try{await api('/api/reports/'+encodeURIComponent(id),{method:'DELETE'});reports=reports.filter(r=>r.id!==id);closeModal();renderView(currentView);toast('Report deleted.','success')}catch(e){toast(e.message,'error')}}
function closeModal(){$('scrim').classList.remove('open')}
async function logout(){try{await api('/api/auth/logout',{method:'POST',body:JSON.stringify({})})}catch(e){}currentView='dashboard';await boot();toast('Signed out of moderator mode.','success')}
async function refreshData(){try{const [r,p,h]=await Promise.all([api('/api/reports'),api('/api/places'),api('/api/health')]);reports=r;places=p;health=h;renderView(currentView)}catch(e){toast(e.message,'error')}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});boot();
</script></body></html>
